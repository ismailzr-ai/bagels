<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Production Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f1e8; --card:#ffffff; --ink:#2a1d13; --sub:#8a7563; --line:#ecdfce;
  --accent:#c1652c; --accent2:#e8a23c; --accent-ink:#fff; --ok:#2f8f4e; --warn:#e0972a; --bad:#d1453d;
  --shadow:0 8px 24px -8px rgba(60,35,10,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#191310;--card:#241b15;--ink:#f2e8dc;--sub:#b3a08c;--line:#382a1e;--shadow:0 8px 28px -8px rgba(0,0,0,.5);}
}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif}
h1,h2,h3{font-family:'Outfit',sans-serif}
header{position:sticky;top:0;padding:14px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);z-index:5;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:19px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:4}
nav button{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;font-weight:500}
nav button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
main{padding:16px 12px 80px;max-width:920px;margin:0 auto}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat b{display:block;font-size:24px;font-family:'Outfit'}
.stat span{font-size:12px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.scroll{overflow-x:auto}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:14px;margin-top:3px;font-family:inherit}
label{font-size:11.5px;color:var(--sub);font-weight:500}
.row{display:flex;gap:8px;align-items:end;margin-bottom:8px;flex-wrap:wrap}
.row>div{flex:1;min-width:110px}
button.act{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:11px 18px;border-radius:12px;font-size:14px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:10px;font-size:13px;cursor:pointer}
button.danger{background:transparent;border:1px solid var(--bad);color:var(--bad);padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px}
.qa button{padding:15px 8px;border-radius:14px}
h3{margin:0 0 10px;font-size:15.5px}
.muted{color:var(--sub);font-size:12px}
.orderline{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.orderline select{flex:2}.orderline input{flex:1}
.x{background:none;border:none;color:var(--bad);font-size:19px;cursor:pointer;padding:0 6px}
.batch{border-left:3px solid var(--accent);padding-left:10px;margin-bottom:12px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
footer{text-align:center;padding:20px;color:var(--sub);font-size:12px}
</style>
</head>
<body>

<header>
  <div>
    <h1>🥯 Production Manager</h1>
    <p id="todayLabel" style="margin:2px 0 0;font-size:11.5px;opacity:.85"></p>
  </div>
  <div style="font-size:11.5px">👤 Ismail</div>
</header>

<nav id="nav"></nav>

<main>
  <div class="view" id="v-dashboard"></div>
  <div class="view" id="v-orders"></div>
  <div class="view" id="v-production"></div>
  <div class="view" id="v-stock"></div>
  <div class="view" id="v-report"></div>
  <div class="view" id="v-settings"></div>
  <footer>Développé par <b>Ismail Zarouali</b></footer>
</main>

<script>
const PRODUCTS=[
 {id:'nature',name:'Bagel Nature',weight:120,dough:'standard'},
 {id:'cumin',name:'Bagel Cumin',weight:120,dough:'standard'},
 {id:'curry',name:'Bagel Curry',weight:120,dough:'standard'},
 {id:'emmental',name:'Bagel Emmental',weight:120,dough:'standard'},
 {id:'sesame',name:'Bagel Sésame',weight:120,dough:'standard'},
 {id:'grain',name:'Bagel Grain et Céréales',weight:120,dough:'standard'},
 {id:'brioche',name:'Bagel Brioche',weight:120,dough:'brioche'},
 {id:'choc_amande',name:'Bagel Chocolat Amande',weight:70,dough:'brioche'},
 {id:'cinnamon',name:'Cinnamon Roll',weight:110,dough:'cinnamon'},
];

const DOUGHS={
 standard:{name:'Pâte Bagel Standard',baseWeight:1645,ing:{Farine:1000,Eau:500,Sel:18,Levure:20,Sucre:75,Huile:30,Améliorant:2}},
 brioche:{name:'Pâte Brioche',baseWeight:1777,ing:{Farine:1000,Eau:400,'Œufs':50,Levure:34,Améliorant:2,Sucre:70,Sel:20,Margarine:150,'Crème':50,Colorant:1}},
 cinnamon:{name:'Pâte Cinnamon Roll',baseWeight:2037,ing:{Farine:1000,Eau:200,'Œufs':200,Sel:20,Sucre:130,'Poudre de lait':40,Levure:45,Beurre:200,Margarine:200,Améliorant:2},
    filling:{baseWeight:876,ing:{Beurre:413,Sucre:413,Cannelle:50}}}
};

let state = {
  orders: [],
  dailyReports: [],
  stock: {},
  settings: { safety: 5, capacity: 25000 }
};

// تحميل البيانات من الذاكرة المحلية
function loadState() {
  const saved = localStorage.getItem('prod_manager_state_v2');
  if(saved) {
    try { state = JSON.parse(saved); } catch(e){}
  }
}

function saveState() {
  localStorage.setItem('prod_manager_state_v2', JSON.stringify(state));
  render(current);
}

function fmtKg(g){return (g/1000).toFixed(2)+' kg';}
function prodQty(o){return o.qty+state.settings.safety;}

function groupByDough(items){
  const g={};
  items.forEach(it=>{
    const p=PRODUCTS.find(x=>x.id===it.productId); if(!p) return;
    const pq=prodQty(it); const w=pq*p.weight;
    g[p.dough]=g[p.dough]||{items:[],weight:0};
    g[p.dough].items.push({name:p.name,pq,weight:p.weight,total:w});
    g[p.dough].weight+=w;
  });
  return g;
}

function splitBatches(totalWeight,capacity){
  if(totalWeight<=0)return[];
  const n=Math.ceil(totalWeight/capacity); const size=totalWeight/n;
  return Array.from({length:n},()=>size);
}

function scaleIng(ing,factor){ const r={}; for(const k in ing) r[k]=+(ing[k]*factor).toFixed(1); return r; }

function computeProduction(items){
  const groups=groupByDough(items); const result=[];
  for(const doughId in groups){
    const dough=DOUGHS[doughId]; const grp=groups[doughId];
    const batches=splitBatches(grp.weight,state.settings.capacity);
    const doughBatches=batches.map((w,i)=>{
      const factor=w/dough.baseWeight;
      const out={n:i+1,weight:w,ing:scaleIng(dough.ing,factor)};
      if(doughId==='cinnamon'){
        const cinItem=grp.items.find(x=>x.name.includes('Cinnamon'));
        if(cinItem){ const cf=(w/grp.weight)*(cinItem.total/dough.baseWeight); out.filling=scaleIng(dough.filling.ing,cf);}
      }
      return out;
    });
    result.push({doughId,doughName:dough.name,totalWeight:grp.weight,items:grp.items,batches:doughBatches});
  }
  return result;
}

const TABS=[['dashboard','Dashboard'],['orders','Commandes'],['production','Production'],['stock','Stock'],['report','Rapport'],['settings','Réglages']];
let current='dashboard';

function switchTo(t){current=t;render(t);}

document.getElementById('nav').innerHTML=TABS.map(([id,label])=>`<button data-t="${id}">${label}</button>`).join('');
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;switchTo(b.dataset.t);});
document.getElementById('todayLabel').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

function render(t){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById('v-'+t).classList.add('on');
  ({dashboard:renderDash,orders:renderOrders,production:renderProduction,stock:renderStock,report:renderReport,settings:renderSettings})[t]();
}

function renderDash(){
  const today=new Date().toDateString();
  const todays=state.orders.filter(o=>new Date(o.date).toDateString()===today);
  const lowStock=Object.entries(state.stock).filter(([k,v])=>v.qty<=v.min);
  
  document.getElementById('v-dashboard').innerHTML=`
  <div class="grid">
    <div class="card stat"><b>${todays.length}</b><span>Commandes aujourd'hui</span></div>
    <div class="card stat"><b>${state.dailyReports.length}</b><span>Rapports enregistrés</span></div>
    <div class="card stat"><b style="color:${lowStock.length?'var(--bad)':'var(--ok)'}">${lowStock.length}</b><span>Alertes stock</span></div>
  </div>
  <div class="card"><h3>Actions rapides</h3>
    <div class="qa">
      <button class="act" onclick="switchTo('orders')">Nouvelle commande</button>
      <button class="act" onclick="switchTo('production')">Production</button>
      <button class="act" onclick="switchTo('report')">Rapport</button>
      <button class="act" onclick="switchTo('stock')">Stock</button>
    </div>
  </div>`;
}

let draftItems=[{productId:PRODUCTS[0].id,qty:''}];
let editingOrderId=null;

function renderOrders(){
  document.getElementById('v-orders').innerHTML=`
  <div class="card"><h3>${editingOrderId?'Modifier commande':'Nouvelle commande'}</h3>
    <div class="row">
      <div><label>Client</label><input id="cl" placeholder="Nom du client"></div>
      <div><label>Type</label><select id="ty"><option value="normal">Normal</option><option value="special">Spéciale</option></select></div>
    </div>
    <div id="lines"></div>
    <button class="ghost" onclick="addLine()">+ Ajouter produit</button>
    <div class="actions" style="margin-top:10px">
      <button class="act" onclick="saveOrder()">${editingOrderId?'Enregistrer modifications':'Enregistrer commande'}</button>
      ${editingOrderId?'<button class="ghost" onclick="cancelEdit()">Annuler</button>':''}
    </div>
  </div>
  <div class="card"><h3>Liste des commandes</h3>
    <div class="scroll"><table>
      <tr><th>Client</th><th>Produits</th><th>Actions</th></tr>
      ${state.orders.map(o=>`<tr><td>${o.client\vert{}\vert{}'-'}</td><td>${o.items.map(i=>PRODUCTS.find(p=>p.id===i.productId)?.name+' x'+i.qty).join(', ')}</td><td><button class="danger" onclick="deleteOrder('${o.id}')">Supprimer</button></td></tr>`).join('')||'<tr><td colspan=3 class="muted">Aucune commande</td></tr>'}
    </table></div>
  </div>`;
  renderLines();
}

function renderLines(){
  const linesEl=document.getElementById('lines');
  if(!linesEl)return;
  linesEl.innerHTML=draftItems.map((it,i)=>`
    <div class="orderline">
      <select onchange="draftItems[${i}].productId=this.value">${PRODUCTS.map(p=>`<option value="${p.id}" ${p.id===it.productId?'selected':''}>${p.name}</option>`).join('')}</select>
      <input type="number" min="0" placeholder="Qté" value="${it.qty}" oninput="draftItems[${i}].qty=this.value">
      <button class="x" onclick="removeLine(${i})">×</button>
    </div>`).join('');
}
function addLine(){draftItems.push({productId:PRODUCTS[0].id,qty:''});renderLines();}
function removeLine(i){draftItems.splice(i,1);if(!draftItems.length)draftItems=[{productId:PRODUCTS[0].id,qty:''}];renderLines();}

function saveOrder(){
  const items=draftItems.filter(i=>+i.qty>0).map(i=>({productId:i.productId,qty:+i.qty}));
  if(!items.length){alert('Ajoutez un produit.');return;}
  state.orders.push({id:'o'+Date.now(),date:new Date().toISOString(),client:document.getElementById('cl').value,type:document.getElementById('ty').value,items});
  draftItems=[{productId:PRODUCTS[0].id,qty:''}];
  saveState();
}

function deleteOrder(id){ state.orders=state.orders.filter(o=>o.id!==id); saveState(); }

let lastCalc=null;
function renderProduction(){
  const items=state.orders.flatMap(o=>o.items);
  lastCalc=computeProduction(items);
  document.getElementById('v-production').innerHTML=`<div class="card"><h3>Calcul de production</h3>
  ${lastCalc.length?lastCalc.map(g=>`<div><b>${g.doughName}</b> —${fmtKg(g.totalWeight)}</div>`).join(''):'<div class="muted">Aucune production requise.</div>'}</div>`;
}

function renderStock(){
  document.getElementById('v-stock').innerHTML=`<div class="card"><h3>Gestion de stock</h3><p class="muted">Bientôt disponible.</p></div>`;
}

function renderReport(){
  document.getElementById('v-report').innerHTML=`<div class="card"><h3>Rapports</h3><p class="muted">Bientôt disponible.</p></div>`;
}

function renderSettings(){
  document.getElementById('v-settings').innerHTML=`<div class="card"><h3>Réglages</h3><p class="muted">Actif localement.</p></div>`;
}

loadState();
render('dashboard');
</script>
</body>
</html>
